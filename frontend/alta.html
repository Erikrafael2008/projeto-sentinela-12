<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alta do Paciente</title>

  <link rel="stylesheet" href="css/style.css">

  <style>

    .cabecalho-alta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .cabecalho-alta h2 {
      margin: 0;
    }

    .btn-voltar {
      background: #6c757d;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-voltar:hover {
      background: #545b62;
    }

    .form-alta {
      background: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-top: 15px;
    }

    .form-alta h3 {
      margin-top: 0;
      color: #218838;
    }

    .campo {
      margin-bottom: 15px;
    }

    .campo label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .campo input,
    .campo select,
    .campo textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 9px 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }

    .campo textarea {
      min-height: 100px;
      resize: vertical;
    }

    .linha {
      display: flex;
      gap: 15px;
    }

    .linha .campo {
      flex: 1;
    }

    .btn-confirmar-alta {
      background: #28a745;
      color: white;
      border: none;
      padding: 11px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      margin-top: 5px;
    }

    .btn-confirmar-alta:hover {
      background: #1e7e34;
    }

    .aviso {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      padding: 12px;
      border-radius: 5px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .sucesso {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      padding: 12px;
      border-radius: 5px;
      margin-top: 15px;
      display: none;
    }

  </style>

</head>


<body>

<div class="container">


  <!-- CABEÇALHO -->

  <div class="cabecalho-alta">

    <h2>🏥 Alta do Paciente</h2>

    <button
      class="btn-voltar"
      onclick="window.location.href='medico.html'"
    >
      ← Voltar para o Médico
    </button>

  </div>


  <hr>


  <!-- AVISO -->

  <div class="aviso">

    ⚠️ Preencha os dados do paciente e confirme a alta
    somente após finalizar o atendimento.

  </div>


  <!-- FORMULÁRIO -->

  <div class="form-alta">

    <h3>📋 Formulário de Alta</h3>


    <!-- PACIENTE -->

    <div class="campo">

      <label for="paciente">
        Nome do Paciente
      </label>

      <input
        type="text"
        id="paciente"
        placeholder="Digite o nome do paciente"
      >

    </div>


    <!-- CPF / IDENTIFICAÇÃO -->

    <div class="linha">

      <div class="campo">

        <label for="cpf">
          CPF
        </label>

        <input
          type="text"
          id="cpf"
          placeholder="000.000.000-00"
        >

      </div>


      <div class="campo">

        <label for="data-alta">
          Data da Alta
        </label>

        <input
          type="date"
          id="data-alta"
        >

      </div>

    </div>


    <!-- DIAGNÓSTICO -->

    <div class="campo">

      <label for="diagnostico">
        Diagnóstico
      </label>

      <input
        type="text"
        id="diagnostico"
        placeholder="Informe o diagnóstico"
      >

    </div>


    <!-- MOTIVO -->

    <div class="campo">

      <label for="motivo">
        Motivo da Alta
      </label>

      <select id="motivo">

        <option value="">
          Selecione o motivo
        </option>

        <option value="cura">
          Alta por cura/melhora
        </option>

        <option value="melhora">
          Alta por melhora clínica
        </option>

        <option value="transferencia">
          Transferência
        </option>

        <option value="solicitacao">
          Alta a pedido do paciente
        </option>

        <option value="outro">
          Outro
        </option>

      </select>

    </div>


    <!-- CONDIÇÃO -->

    <div class="campo">

      <label for="condicao">
        Condição do Paciente na Alta
      </label>

      <select id="condicao">

        <option value="">
          Selecione a condição
        </option>

        <option value="estavel">
          Estável
        </option>

        <option value="melhorado">
          Melhorado
        </option>

        <option value="curado">
          Curado
        </option>

        <option value="transferido">
          Transferido
        </option>

      </select>

    </div>


    <!-- ORIENTAÇÕES -->

    <div class="campo">

      <label for="orientacoes">
        Orientações ao Paciente
      </label>

      <textarea
        id="orientacoes"
        placeholder="Digite as orientações, cuidados, retorno, medicamentos e recomendações..."
      ></textarea>

    </div>


    <!-- OBSERVAÇÕES -->

    <div class="campo">

      <label for="observacoes">
        Observações
      </label>

      <textarea
        id="observacoes"
        placeholder="Observações adicionais sobre a alta..."
      ></textarea>

    </div>


    <!-- BOTÃO -->

    <button
      class="btn-confirmar-alta"
      onclick="confirmarAlta()"
    >
      🏥 Confirmar Alta do Paciente
    </button>


    <!-- MENSAGEM -->

    <div
      id="mensagem-sucesso"
      class="sucesso"
    >
      ✅ Alta do paciente registrada com sucesso!
    </div>

  </div>


</div>


<script>


// Coloca a data atual automaticamente
function colocarDataAtual() {

  const hoje = new Date();

  const ano = hoje.getFullYear();

  const mes =
    String(hoje.getMonth() + 1).padStart(2, "0");

  const dia =
    String(hoje.getDate()).padStart(2, "0");

  document.getElementById("data-alta").value =
    ano + "-" + mes + "-" + dia;

}


function confirmarAlta() {


  const paciente =
    document.getElementById("paciente").value.trim();


  const cpf =
    document.getElementById("cpf").value.trim();


  const dataAlta =
    document.getElementById("data-alta").value;


  const diagnostico =
    document.getElementById("diagnostico").value.trim();


  const motivo =
    document.getElementById("motivo").value;


  const condicao =
    document.getElementById("condicao").value;


  const orientacoes =
    document.getElementById("orientacoes").value.trim();


  const observacoes =
    document.getElementById("observacoes").value.trim();


  // Validações

  if (!paciente) {

    alert(
      "⚠️ Informe o nome do paciente."
    );

    return;

  }


  if (!dataAlta) {

    alert(
      "⚠️ Informe a data da alta."
    );

    return;

  }


  if (!diagnostico) {

    alert(
      "⚠️ Informe o diagnóstico."
    );

    return;

  }


  if (!motivo) {

    alert(
      "⚠️ Selecione o motivo da alta."
    );

    return;

  }


  if (!condicao) {

    alert(
      "⚠️ Informe a condição do paciente na alta."
    );

    return;

  }


  // Confirmação

  const confirmar = confirm(

    "Deseja realmente confirmar a alta do paciente " +
    paciente +
    "?"

  );


  if (!confirmar) {

    return;

  }


  // Envia os dados para o servidor

  fetch("/alta-paciente", {

    method: "POST",

    headers: {

      "Content-Type":
        "application/json"

    },

    body: JSON.stringify({

      paciente: paciente,

      cpf: cpf,

      dataAlta: dataAlta,

      diagnostico: diagnostico,

      motivo: motivo,

      condicao: condicao,

      orientacoes: orientacoes,

      observacoes: observacoes

    })

  })


  .then(response => {

    if (!response.ok) {

      throw new Error(
        "Erro ao registrar alta."
      );

    }

    return response.json();

  })


  .then(data => {

    document.getElementById(
      "mensagem-sucesso"
    ).style.display = "block";


    alert(
      "✅ Alta realizada com sucesso para " +
      paciente +
      "!"
    );


    // Limpa o formulário

    document.getElementById(
      "paciente"
    ).value = "";


    document.getElementById(
      "cpf"
    ).value = "";


    document.getElementById(
      "diagnostico"
    ).value = "";


    document.getElementById(
      "motivo"
    ).value = "";


    document.getElementById(
      "condicao"
    ).value = "";


    document.getElementById(
      "orientacoes"
    ).value = "";


    document.getElementById(
      "observacoes"
    ).value = "";


    colocarDataAtual();

  })


  .catch(error => {

    console.error(error);

    alert(
      "❌ Não foi possível registrar a alta do paciente."
    );

  });

}


// Carrega a data ao abrir a página
colocarDataAtual();


</script>


</body>

</html>
