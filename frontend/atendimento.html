<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atendimento</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h2>Cadastro de Atendimento</h2>

  <form id="formAtendimento">

    <label for="nome">Nome completo</label>
    <input
      type="text"
      id="nome"
      name="nome"
      placeholder="Digite o nome completo"
      required
    >

    <label for="cpf">CPF</label>
    <input
      type="text"
      id="cpf"
      name="cpf"
      placeholder="000.000.000-00"
      maxlength="14"
      required
    >

    <label for="dataNascimento">Data de nascimento</label>
    <input
      type="date"
      id="dataNascimento"
      name="dataNascimento"
      required
    >

    <label for="sexo">Sexo</label>
    <select id="sexo" name="sexo" required>
      <option value="">Selecione</option>
      <option value="Feminino">Feminino</option>
      <option value="Masculino">Masculino</option>
      <option value="Outro">Outro</option>
      <option value="Nao informado">Prefiro não informar</option>
    </select>

    <label for="nomeMae">Nome da mãe</label>
    <input
      type="text"
      id="nomeMae"
      name="nomeMae"
      placeholder="Digite o nome completo da mãe"
      required
    >

    <label for="estadoCivil">Estado civil</label>
    <select id="estadoCivil" name="estadoCivil" required>
      <option value="">Selecione</option>
      <option value="Solteiro">Solteiro(a)</option>
      <option value="Casado">Casado(a)</option>
      <option value="Divorciado">Divorciado(a)</option>
      <option value="Viuvo">Viúvo(a)</option>
      <option value="Uniao estavel">União estável</option>
    </select>

    <label for="endereco">Endereço</label>
    <input
      type="text"
      id="endereco"
      name="endereco"
      placeholder="Rua, número, bairro"
      required
    >

    <label for="cidade">Cidade</label>
    <input
      type="text"
      id="cidade"
      name="cidade"
      placeholder="Digite a cidade"
      required
    >

    <label for="estado">Estado</label>
    <select id="estado" name="estado" required>
      <option value="">Selecione o estado</option>
      <option value="AC">Acre</option>
      <option value="AL">Alagoas</option>
      <option value="AP">Amapá</option>
      <option value="AM">Amazonas</option>
      <option value="BA">Bahia</option>
      <option value="CE">Ceará</option>
      <option value="DF">Distrito Federal</option>
      <option value="ES">Espírito Santo</option>
      <option value="GO">Goiás</option>
      <option value="MA">Maranhão</option>
      <option value="MT">Mato Grosso</option>
      <option value="MS">Mato Grosso do Sul</option>
      <option value="MG">Minas Gerais</option>
      <option value="PA">Pará</option>
      <option value="PB">Paraíba</option>
      <option value="PR">Paraná</option>
      <option value="PE">Pernambuco</option>
      <option value="PI">Piauí</option>
      <option value="RJ">Rio de Janeiro</option>
      <option value="RN">Rio Grande do Norte</option>
      <option value="RS">Rio Grande do Sul</option>
      <option value="RO">Rondônia</option>
      <option value="RR">Roraima</option>
      <option value="SC">Santa Catarina</option>
      <option value="SP">São Paulo</option>
      <option value="SE">Sergipe</option>
      <option value="TO">Tocantins</option>
    </select>

    <label for="cep">CEP</label>
    <input
      type="text"
      id="cep"
      name="cep"
      placeholder="00000-000"
      maxlength="9"
    >

    <label for="telefone">Telefone</label>
    <input
      type="tel"
      id="telefone"
      name="telefone"
      placeholder="(00) 00000-0000"
      required
    >

    <label for="email">E-mail</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="exemplo@gmail.com"
    >

    <label for="tipo">Tipo de atendimento</label>
    <select id="tipo" name="tipo" required>
      <option value="">Selecione</option>
      <option value="Convenio">Convênio</option>
      <option value="Particular">Particular</option>
    </select>

    <label for="convenio">Nome do convênio</label>
    <input
      type="text"
      id="convenio"
      name="convenio"
      placeholder="Ex.: Unimed, Bradesco Saúde..."
    >

    <label for="numeroCarteirinha">Número da carteirinha</label>
    <input
      type="text"
      id="numeroCarteirinha"
      name="numeroCarteirinha"
      placeholder="Número da carteirinha do convênio"
    >

    <label for="foto">Foto do paciente</label>
    <input
      type="file"
      id="foto"
      name="foto"
      accept="image/*"
    >

    <button type="submit">Cadastrar</button>

  </form>

</div>

<script>

document.getElementById("formAtendimento").addEventListener("submit", async function(event) {

  event.preventDefault();

  const dados = {
    nome: document.getElementById("nome").value,
    cpf: document.getElementById("cpf").value,
    dataNascimento: document.getElementById("dataNascimento").value,
    sexo: document.getElementById("sexo").value,
    nomeMae: document.getElementById("nomeMae").value,
    estadoCivil: document.getElementById("estadoCivil").value,
    endereco: document.getElementById("endereco").value,
    cidade: document.getElementById("cidade").value,
    estado: document.getElementById("estado").value,
    cep: document.getElementById("cep").value,
    telefone: document.getElementById("telefone").value,
    email: document.getElementById("email").value,
    tipo: document.getElementById("tipo").value,
    convenio: document.getElementById("convenio").value,
    numeroCarteirinha: document.getElementById("numeroCarteirinha").value
  };

  try {

    const resposta = await fetch("http://localhost:3000/atendimento", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(dados)
    });

    if (!resposta.ok) {
      throw new Error("Erro ao cadastrar paciente");
    }

    alert("Paciente cadastrado e enviado para a triagem!");

    document.getElementById("formAtendimento").reset();

  } catch (erro) {

    console.error(erro);

    alert("Não foi possível cadastrar o paciente.");

  }

});

</script>

</body>
</html>
